name: Go Build and Compress

on:
  push:
    branches: ["go"]
    paths:
      - "*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-build.yml"
  pull_request:
    branches: ["go"]
    paths:
      - "*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Build binary
        run: go build -trimpath -ldflags="-s -w" -o tgbot .

      - name: Compress binary
        run: upx --best --lzma tgbot

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgbot-linux-amd64
          path: tgbot
          if-no-files-found: error
